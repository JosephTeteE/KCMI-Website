# Manual-only cross-browser QA for KCMI.
# Does NOT run on push/PR. Does NOT use Hub credentials, MFA, or storageState.
#
# Human steps:
# 1. Open GitHub → Actions → "KCMI Cross-Browser QA (Manual)"
# 2. Run workflow_dispatch
# 3. Review Firefox / WebKit / Chromium public critical results
# 4. Authenticated Hub AAL2 flows remain local Chromium + human MFA

name: KCMI Cross-Browser QA (Manual)

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: platform

jobs:
  cross-browser-public:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build (seed content, no secrets)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3012
          CONTENT_SOURCE: seed
      - name: Public critical — Chromium
        run: npx playwright test --project=fs-chromium e2e/full-spectrum/cross-browser-critical.spec.ts e2e/full-spectrum/public-interactions.spec.ts e2e/full-spectrum/smoke.spec.ts
        env:
          E2E_PORT: "3012"
          CONTENT_SOURCE: seed
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3012
      - name: Public critical — Firefox
        run: npx playwright test --project=fs-firefox e2e/full-spectrum/cross-browser-critical.spec.ts e2e/full-spectrum/public-interactions.spec.ts e2e/full-spectrum/smoke.spec.ts
        env:
          E2E_PORT: "3012"
          CONTENT_SOURCE: seed
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3012
      - name: Public critical — WebKit
        run: npx playwright test --project=fs-webkit e2e/full-spectrum/cross-browser-critical.spec.ts e2e/full-spectrum/public-interactions.spec.ts e2e/full-spectrum/smoke.spec.ts
        env:
          E2E_PORT: "3012"
          CONTENT_SOURCE: seed
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3012
      - name: Mobile WebKit emulation
        run: npx playwright test --project=fs-mobile-webkit e2e/full-spectrum/cross-browser-critical.spec.ts e2e/full-spectrum/public-interactions.spec.ts
        env:
          E2E_PORT: "3012"
          CONTENT_SOURCE: seed
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3012
      - name: Upload Playwright report (public only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kcmi-cross-browser-report
          path: platform/playwright-report/
          retention-days: 14
